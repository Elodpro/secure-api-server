# Zone de rate limiting (10 requêtes / seconde / ip)
limit_req_zone $binary_remote_addr zone=api_ratelimit:10m rate 10r/s;

# Map pour CORS (ici on autorise seulement localhost pour dev
map $http_origin $cors-allowed_origin {
    default "";
    "~^https?//localhost(:[0-9]+)?$" $http-origin;
}

# Logs JSON
log_format json_combined escape=json
    '{"time":"$time_iso8601", "remote_addr", "req":"$request", '
    '"status":$status, "bytes":$bytes_sent, "referer":"$http_referer", '
    '"xff":"nb

access_log logs/secure_api_access.log json_combined;
error_log logs/secure_api_error.log;

#backend spring boot
upstream secure_api_backend {
    server 127.0.0.1:8080;
}

# HTTP -> redirection vers HTTPS
server {
  listen 80;
  server_name localhost;
  return 301 https://$host$request_uri;
}

# HTTPS + sécurité + reverse proxy vers Spring Boot local (127.0.0.1:8080)
server {
      listen 443 ssl http2;
      server_name localhost;

      # Chemins Windows pointant vers TES certs locaux (hors repo)
      ssl_certificate     C:/nginx/conf/ssl/localhost+2.pem;
      ssl_certificate_key C:/nginx/conf/ssl/localhost+2-key.pem;

      ssl_protocols TLSv1.2 TLSv1.3;
      ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256";
      ssl_prefer_server_ciphers on;

      server_tokens off;

      # En-têtes de sécurité (HSTS, etc.)
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'self'" always;

      # CORS (si origine autorisée)
      if ($cors_allowed_origin !=""){
            add_header Access-Control-Allow-Origin $cors_allowed_origin always;
            add_header Vary "Origin" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Headers "Authorization,Content-Type" always;
            add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
      }

      location / {
            limit_req zone=api_ratelimit burst=20 nodelay;


            if($request_method = OPTIONS) {
                add_header Access-Control-Max-Age 86400;
                add_header Content-Lenght 0;
                add_header Content-Type text/plain;
                return 204;
            }

        proxy_pass http://127.0.0.1:8080; # adapte si ton backend écoute ailleurs
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
      }

      # Sonde simple
      location = /.well-known/healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
      }
    }
