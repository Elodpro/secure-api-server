# Reverse proxy sécurisé pour secure-api-server

#mise en place du reverse proxy HTTPS avec durcissement périmétrique :
# HSTS, CSP restrictive, rate limiting, logs JSON, gestion CORS,
#séparation claire HTTP/HTTPS, et exposition contrôlée de la santé applicative.

# Rôle :
# - Forcer HTTPS
# - Terminer TLS côté Nginx
# - Protéger l'API Spring Boot (127.0.0.1:8080)
# - Ajouter des protections périmétriques (headers, rate limit, CORS, logs)

# 1. Rate limiting global

# On définit une "zone" de limitation basée sur l'adresse IP du client.
# - $binary_remote_addr : IP du client en format binaire (compact, efficace)
# - zone=api_ratelimit:10m : nom de la zone + taille mémoire (10 Mo pour stocker l'état)
# - rate=10r/s : maximum 10 requêtes par seconde par IP avant de commencer à limiter
limit_req_zone $binary_remote_addr zone=api_ratelimit:10m rate=10r/s;


# 2. Gestion CORS (whitelist des origines)
# Objectif : n'autoriser que certaines origines à appeler l'API depuis un navigateur.
# Ici : uniquement localhost (tous ports) pour l'environnement de dev.
# $http_origin : header Origin envoyé par le navigateur.
# Si l'origine matche la regex → on renvoie cette origin, sinon chaîne vide.
map $http_origin $cors_allowed_origin {
    default "";
    "~^https?://localhost(:[0-9]+)?$" $http_origin;
}

# 3. Logs JSON (observabilité)

# Format de log JSON pour faciliter l'analyse (Elastic, Splunk, etc.)
log_format json_combined escape=json
  '{ "time":"$time_iso8601", '
  '"remote":"$remote_addr", '
  '"req":"$request", '
  '"status":$status, '
  '"bytes":$bytes_sent, '
  '"referer":"$http_referer", '
  '"ua":"$http_user_agent", '
  '"req_time":$request_time, '
  '"up_time":"$upstream_response_time", '
  '"xff":"$http_x_forwarded_for", '
  '"host":"$host" }';

# On applique ce format aux logs d'accès et on définit aussi le fichier d'erreurs.
access_log logs/secure_api_access.log json_combined;
error_log  logs/secure_api_error.log;

# 4. Définition du backend

# Groupe de serveurs en backend.
# Ici un seul : Spring Boot qui écoute en local sur le port 8080.
# Avantage : si un jour on a plusieurs instances, on les ajoute ici sans toucher le reste.
upstream secure_api_backend {
    server api:8080;        #on cible le service docker api
}

# 5. HTTP -> HTTPS (redirection forcée)

server {
    listen 80;
    server_name localhost;

    # Toute requête HTTP est redirigée en HTTPS.
    # Objectif : forcer le chiffrage et éviter le trafic en clair.
    return 301 https://$host$request_uri;
}

# 6. Serveur HTTPS principal

server {
    listen 443 ssl http2;
    server_name localhost;

    # TLS / Certificats

    # Certificats locaux pour ton environnement de dev.
    # IMPORTANT : ces fichiers ne doivent PAS être commités dans le repo.
    ssl_certificate     C:/nginx/certs/server.crt;
    ssl_certificate_key C:/nginx/conf/ssl/server.key;

    # Autoriser uniquement les versions récentes de TLS.
    ssl_protocols TLSv1.2 TLSv1.3;

    # Suite de chiffrements solides (réduction des vieux algo faibles).
    ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256";
    ssl_prefer_server_ciphers on;

    # Ne pas exposer la version de Nginx dans les réponses HTTP.
    # Objectif : réduire les infos pour un attaquant.
    server_tokens off;

    # Headers de sécurité HTTP

    # HSTS : oblige le navigateur à toujours utiliser HTTPS vers ce domaine.
    # max-age=31536000 : 1 an
    # includeSubDomains : inclut les sous-domaines (ici symbolique, mais bonne pratique)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Empêche le navigateur d'essayer de deviner le type MIME (protège certains XSS).
    add_header X-Content-Type-Options "nosniff" always;

    # Empêche l'inclusion du site dans des iframes externes (clickjacking).
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Contrôle les infos envoyées dans le header Referer.
    add_header Referrer-Policy "no-referrer" always;

    # CSP très stricte adaptée à une API (aucun chargement de ressource).
    # Ici on montre qu'on sait durcir même si on ne sert pas de front.
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'self'" always;

    # CORS : exposer l'API à une origin front autorisée

    # Si l'origine de la requête fait partie des origins autorisées (cf. map plus haut),
    # on renvoie les en-têtes CORS.
    if ($cors_allowed_origin != "") {
        # Autorise SEULEMENT l'origin validée (pas de wildcard '*').
        add_header Access-Control-Allow-Origin $cors_allowed_origin always;

        # Indique que la réponse varie en fonction de l'Origin (pour les caches).
        add_header Vary "Origin" always;

        # Autorise l'envoi de cookies / credentials SI nécessaire.
        add_header Access-Control-Allow-Credentials "true" always;

        # Headers autorisés côté client.
        add_header Access-Control-Allow-Headers "Authorization,Content-Type" always;

        # Méthodes HTTP autorisées.
        add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
    }

    # Location principale : proxy vers l'API Spring Boot

    location / {
        # Application du rate limiting défini globalement :
        # - 10 req/s par IP avec une tolérance de burst de 20.
        limit_req zone=api_ratelimit burst=20 nodelay;

        # Gestion des requêtes préflight CORS (OPTIONS).
        # Pour les appels cross-origin, le navigateur envoie une requête OPTIONS
        # avant la vraie requête. On y répond sans déranger le backend.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Max-Age 86400;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        # Envoi des requêtes vers le backend Spring Boot.
        proxy_pass http://secure_api_backend;
        proxy_http_version 1.1;

        # Préserve le host original (pratique pour logs / routes).
        proxy_set_header Host $host;

        # IP réelle du client (sinon le backend ne verrait que 127.0.0.1).
        proxy_set_header X-Real-IP $remote_addr;

        # Chaîne complète des IP par lesquelles la requête est passée.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Indique au backend que le client est venu en HTTPS côté frontal.
        proxy_set_header X-Forwarded-Proto https;

        # Timeout lecture réponse backend.
        proxy_read_timeout 60s;
    }

    # Sonde technique Nginx (distincte de /actuator côté Spring)

    # Endpoint ultra simple pour vérifier que Nginx tourne.
    # Peut être utilisé par un load balancer ou un script de supervision.
    location = /.well-known/healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}
